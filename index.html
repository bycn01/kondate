<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F3F5EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131915" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="こんだて">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>はちの木 給食こんだて</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: 1-column phone app. Sticky header + date strip, one big "day card"; list view for the whole month. */
:root {
  --bg: #F3F5EF;
  --surface: #FFFFFF;
  --ink: #23302A;
  --muted: #66756C;
  --line: #DCE2D6;
  --accent: #2F7A5B;
  --accent-soft: #E2EFE7;
  --today: #C98512;
  --today-soft: #FBEFD6;
  --red: #C8463D;
  --red-soft: #FBE6E3;
  --yellow: #A8770E;
  --yellow-soft: #FBF1D7;
  --green: #357F45;
  --green-soft: #E2F1E3;
  --sat: #2F66A8;
  --sun: #C8463D;
  --off: #EBEEE7;
  --shadow: 0 1px 2px rgba(35,48,42,.06), 0 6px 20px rgba(35,48,42,.06);
  --f-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", sans-serif;
  --f-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131915; --surface: #1C2420; --ink: #E5ECE7; --muted: #95A39A; --line: #2D3731;
    --accent: #6CC39A; --accent-soft: #1F382C; --today: #EAB34E; --today-soft: #3A2F18;
    --red: #F08C82; --red-soft: #3A2220; --yellow: #E6C066; --yellow-soft: #36301B;
    --green: #82CC8F; --green-soft: #1D3222; --sat: #8DB2E6; --sun: #F08C82; --off: #181F1B;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131915; --surface: #1C2420; --ink: #E5ECE7; --muted: #95A39A; --line: #2D3731;
  --accent: #6CC39A; --accent-soft: #1F382C; --today: #EAB34E; --today-soft: #3A2F18;
  --red: #F08C82; --red-soft: #3A2220; --yellow: #E6C066; --yellow-soft: #36301B;
  --green: #82CC8F; --green-soft: #1D3222; --sat: #8DB2E6; --sun: #F08C82; --off: #181F1B;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  padding-block: 14px 8px;
  display: grid; gap: 10px;
}
.titlerow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.mnav { display: flex; align-items: center; gap: 4px; min-width: 0; }
.mbtn {
  flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; border: 0;
  background: var(--off); color: var(--ink); font-size: 18px; font-weight: 700; line-height: 1;
  cursor: pointer; display: grid; place-items: center; padding: 0 0 2px;
}
.mbtn:disabled { visibility: hidden; }
.mbtn:active { transform: scale(.92); }
.mnav .title { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 380px) { .title small { display: none; } }
.title { font-family: var(--f-display); font-weight: 700; font-size: 22px; margin: 0; letter-spacing: .02em; }
.title small { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 6px; letter-spacing: 0; }
.todaybtn {
  flex-shrink: 0; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 4px 14px; font-size: 13px; font-weight: 700; color: var(--accent); cursor: pointer;
}
.todaybtn[hidden] { display: none; }

/* bottom tab bar (app-style) */
html, body { -webkit-tap-highlight-color: transparent; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tabbar button {
  border: 0; background: transparent; cursor: pointer; padding: 8px 0 7px;
  display: grid; justify-items: center; gap: 2px; color: var(--muted);
  font-size: 11px; font-weight: 700; user-select: none; -webkit-user-select: none;
}
.tabbar svg { width: 24px; height: 24px; transition: transform .2s ease; }
.tabbar button[aria-selected="true"] { color: var(--accent); }
.tabbar button[aria-selected="true"] svg { transform: translateY(-1px) scale(1.08); }
.tabbar .pill { width: 52px; height: 28px; border-radius: 999px; display: grid; place-items: center; transition: background .2s ease; }
.tabbar button[aria-selected="true"] .pill { background: var(--accent-soft); }

/* press feedback */
.chip, .row, .nav button, .weekbar button, .todaybtn, .snack, .age button { transition: transform .12s ease; }
.chip:active, button.row:active, .nav button:active, .weekbar button:active, .todaybtn:active { transform: scale(.96); }

/* view transitions */
.view-enter { animation: viewIn .22s ease-out; }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.card.dragging { transition: none !important; }
.card.sliding { transition: transform .2s ease-out, opacity .2s ease-out; }
@media (prefers-reduced-motion: reduce) {
  .view-enter, .card.swap { animation: none !important; }
  .card.sliding { transition: none; }
}

/* date strip */
.strip {
  display: flex; gap: 6px; overflow-x: auto; scroll-snap-type: x proximity;
  padding-block: 2px 6px; margin-inline: -16px; padding-inline: 16px;
  scrollbar-width: none;
}
.strip::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; width: 46px; scroll-snap-align: center;
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px;
  padding: 5px 0 6px; display: grid; justify-items: center; gap: 0; cursor: pointer;
  font-variant-numeric: tabular-nums; position: relative;
}
.chip .wd { font-size: 11px; color: var(--muted); font-weight: 700; }
.chip .d { font-family: var(--f-display); font-weight: 700; font-size: 18px; line-height: 1.2; }
.chip.sat .wd { color: var(--sat); }
.chip.sun .wd, .chip.hol .wd { color: var(--sun); }
.chip.off { background: var(--off); border-color: transparent; }
.chip.off .d { color: var(--muted); font-weight: 500; }
.chip.ev::after {
  content: ""; position: absolute; top: 4px; right: 5px; width: 6px; height: 6px;
  border-radius: 50%; background: var(--today);
}
.chip.is-today { border-color: var(--today); }
.chip[aria-selected="true"] { background: var(--accent); border-color: var(--accent); }
.chip[aria-selected="true"] .wd, .chip[aria-selected="true"] .d { color: var(--surface); }

/* day card */
.card {
  background: var(--surface); border-radius: 22px; box-shadow: var(--shadow);
  padding: 20px 18px 18px; display: grid; gap: 18px; margin-top: 6px;
  touch-action: pan-y;
}
.dayhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bigdate { font-family: var(--f-display); font-weight: 700; font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.bigdate .w { font-size: 18px; margin-left: 2px; }
.bigdate .w.sat { color: var(--sat); }
.bigdate .w.sun { color: var(--sun); }
.rel { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--today-soft); color: var(--today); }
.event {
  display: grid; gap: 2px; background: var(--today-soft); border-radius: 14px; padding: 10px 14px;
}
.event b { font-family: var(--f-display); font-size: 15px; }
.event span { font-size: 13px; color: var(--muted); }

.sec { display: grid; gap: 8px; }
.label { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .08em; margin: 0; }
.dishes { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.dishes li { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: baseline; }
.dishes li .nm { font-family: var(--f-display); font-weight: 700; font-size: 20px; line-height: 1.4; min-width: 0; text-wrap: balance; }
.dishes li.fruit .nm, .dishes li.soup .nm { font-size: 17px; }
.dishes li .nm small { font-family: var(--f-body); font-weight: 400; font-size: 11px; color: var(--muted); margin-left: 6px; }
.cat {
  font-size: 11px; font-weight: 700; text-align: center; border-radius: 6px; padding: 1px 0;
  background: var(--off); color: var(--muted); position: relative; top: -2px;
}
.cat.staple { background: var(--yellow-soft); color: var(--yellow); }
.cat.main { background: var(--red-soft); color: var(--red); }
.cat.side { background: var(--green-soft); color: var(--green); }
.cat.soup { background: var(--accent-soft); color: var(--accent); }
.drink { font-size: 13px; color: var(--muted); margin: 0; }
.home {
  font-family: var(--f-body); font-size: 11px; font-weight: 700; color: var(--today);
  background: var(--today-soft); border-radius: 999px; padding: 1px 8px; margin-left: 8px;
  vertical-align: middle; white-space: nowrap;
}

/* nutrition */
.nhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.age { display: inline-flex; background: var(--off); border-radius: 999px; padding: 3px; }
.age button {
  border: 0; background: transparent; border-radius: 999px; padding: 3px 10px;
  font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer;
}
.age button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.ntiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.nt { background: var(--bg); border-radius: 12px; padding: 8px 8px 7px; min-width: 0; display: grid; gap: 1px; }
.nt .label { font-size: 10px; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nt .nv { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 19px; line-height: 1.25; font-variant-numeric: tabular-nums; }
.nt .nv small { font-family: var(--f-body); font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 2px; }
.nt .na { color: var(--muted); }
.nt .avg { margin: 0; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 440px) { .ntiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.wkcal { margin-left: 8px; font-variant-numeric: tabular-nums; }
.wdish small { font-weight: 400; color: var(--today); font-size: 11px; }

/* week view */
.weekbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px; }
.weekbar b { font-family: var(--f-display); font-size: 17px; font-variant-numeric: tabular-nums; }
.weekbar button {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px;
  width: 44px; height: 38px; font-weight: 700; cursor: pointer;
}
.weekbar button:disabled { opacity: .35; cursor: default; }
.wdish { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 14px; line-height: 1.5; }
.wdish span { display: inline-flex; align-items: baseline; gap: 4px; font-weight: 700; }
.wdish .cat { font-size: 10px; padding: 0 5px; top: -1px; }

.snacks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.snack { background: var(--bg); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.snack .label { font-size: 11px; }
.snack p { margin: 2px 0 0; font-weight: 700; font-size: 15px; line-height: 1.45; }
.snack p.none { color: var(--muted); font-weight: 400; }

.groups { display: grid; gap: 8px; }
.grp { border-radius: 14px; padding: 10px 12px; display: grid; gap: 4px; }
.grp h4 { margin: 0; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.grp h4 i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.grp p { margin: 0; font-size: 14px; line-height: 1.7; }
.grp.red { background: var(--red-soft); } .grp.red h4 { color: var(--red); } .grp.red i { background: var(--red); }
.grp.yellow { background: var(--yellow-soft); } .grp.yellow h4 { color: var(--yellow); } .grp.yellow i { background: var(--yellow); }
.grp.green { background: var(--green-soft); } .grp.green h4 { color: var(--green); } .grp.green i { background: var(--green); }

details.more summary {
  cursor: pointer; font-size: 13px; font-weight: 700; color: var(--accent); list-style: none;
  padding: 6px 0;
}
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "＋ "; }
details.more[open] summary::before { content: "－ "; }

.offday { text-align: center; padding: 18px 0 8px; display: grid; gap: 6px; }
.offday p { margin: 0; }
.offday .big { font-family: var(--f-display); font-weight: 700; font-size: 20px; }
.offday .sub { color: var(--muted); font-size: 14px; }

.nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.nav button {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px;
  padding: 10px; font-weight: 700; font-size: 14px; cursor: pointer;
}
.nav button:disabled { opacity: .35; cursor: default; }

/* list view */
.list { display: grid; gap: 6px; margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: start;
  background: var(--surface); border-radius: 16px; padding: 10px 14px; border: 0; text-align: left;
  cursor: pointer; width: 100%;
}
.row.off { background: transparent; padding-block: 4px; cursor: default; }
.row.is-today { outline: 2px solid var(--today); }
.row .dt { font-family: var(--f-display); font-weight: 700; font-size: 20px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.row .dt span { display: block; font-size: 12px; color: var(--muted); }
.row .dt span.sat { color: var(--sat); }
.row .dt span.sun { color: var(--sun); }
.row .body { min-width: 0; display: grid; gap: 2px; }
.row .main { font-weight: 700; font-size: 15px; line-height: 1.5; }
.row .snk { font-size: 12px; color: var(--muted); }
.row .tag { font-size: 12px; font-weight: 700; color: var(--today); }
.row.off .main { color: var(--muted); font-weight: 400; font-size: 13px; }

.notes { margin-top: 22px; display: grid; gap: 8px; }
.notes h3 { font-family: var(--f-display); font-size: 16px; margin: 0; }
.notes ul { margin: 0; padding-left: 1.2em; font-size: 14px; color: var(--muted); display: grid; gap: 4px; }
.foot { margin-top: 20px; font-size: 12px; color: var(--muted); text-align: center; }

@media (prefers-reduced-motion: no-preference) {
  .card.swap { animation: fade .18s ease-out; }
  @keyframes fade { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="titlerow">
      <div class="mnav">
        <button class="mbtn" id="m-prev" aria-label="前の月">‹</button>
        <h1 class="title" id="ttl">給食こんだて<small>はちの木こども園</small></h1>
        <button class="mbtn" id="m-next" aria-label="次の月">›</button>
      </div>
      <button class="todaybtn" id="todaybtn" hidden>今日</button>
    </div>
    <nav class="strip" id="strip" aria-label="日付をえらぶ"></nav>
  </header>

  <main>
    <section id="view-day"><article class="card" id="card"></article></section>
    <section id="view-week" hidden>
      <div class="weekbar">
        <button id="wk-prev" aria-label="前の週">←</button>
        <b id="wk-title"></b>
        <button id="wk-next" aria-label="次の週">→</button>
      </div>
      <div class="list" id="week"></div>
    </section>
    <section id="view-list" hidden>
      <div class="list" id="list"></div>
      <div class="notes" id="notes"></div>
    </section>
  </main>
  <p class="foot">園からの献立表（PDF）をもとに作成。内容は園の配布物が正式です。</p>
</div>

<nav class="tabbar" role="tablist" aria-label="表示の切り替え">
  <div class="tabbar-in">
    <button id="tab-day" role="tab" aria-selected="true">
      <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7"/><path d="M8.5 13a3.5 3.5 0 0 0 7 0"/><path d="M12 3v3"/></svg></span>日
    </button>
    <button id="tab-week" role="tab" aria-selected="false">
      <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 10h18"/><path d="M8 3v4M16 3v4"/><path d="M7 14h10"/></svg></span>週
    </button>
    <button id="tab-list" role="tab" aria-selected="false">
      <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 10h18"/><path d="M8 3v4M16 3v4"/><circle cx="8" cy="14" r=".8" fill="currentColor"/><circle cx="12" cy="14" r=".8" fill="currentColor"/><circle cx="16" cy="14" r=".8" fill="currentColor"/><circle cx="8" cy="17.2" r=".8" fill="currentColor"/><circle cx="12" cy="17.2" r=".8" fill="currentColor"/></svg></span>月
    </button>
  </div>
</nav>

<script>
/* ===== 毎月ここに1か月分を追加する（古い月は消してOK） ===== */
const MONTHS = [];

MONTHS.push({
  year: 2026, month: 10,
  school: "はちの木こども園",
  // m: 給食（麦茶は省略）, am: 午前のおやつ, pm: 午後のおやつ
  // r: 血・肉・骨になる（赤）, y: 熱や力になる（黄）, g: 体の調子を整える（緑）
  days: {
    1:  { m:["酢豚","コンソメスープ","スパゲティサラダ"], am:"クラッカー", pm:["磯風味ポテト","牛乳"],
          r:"豚肉、牛乳、うずら卵、ハム、豆腐、小女子、海苔", y:"スパゲッティ、米、マヨネーズ、片栗粉、じゃが芋、油", g:"人参、ピーマン、竹の子、玉葱、しいたけ、パイン缶、えのき茸、りんご、胡瓜、みかん缶、三つ葉" },
    2:  { m:["けんちん煮","納豆和え","味噌汁"], am:"バナナチップ", pm:["五平餅","牛乳"],
          r:"豚肉、納豆、海苔、しらす干し、味噌、牛乳", y:"里芋、砂糖、油、ゴマ、もち米、米", g:"人参、こんにゃく、ごぼう、大根、グリンピース、小松菜、玉葱、インゲン" },
    3:  { m:["煮込みうどん","バナナ"], am:"", pm:["食パンサンド","せんべい","牛乳"],
          r:"鶏肉、油揚げ、牛乳", y:"うどん、砂糖、食パン、ジャム", g:"人参、しいたけ、長葱、バナナ" },
    4:  { off:"日曜日" },
    5:  { m:["鯖の薬味ソースかけ","味噌汁","海藻サラダ"], am:"南瓜ボーロ", pm:["蒸しさつま芋","オレンジ","牛乳"],

/* 表示する月を決める。月の切り替えボタンで選んだ月 → 今日の月 → これからの月 → いちばん新しい月 */
MONTHS.sort((a, b) => (a.year * 12 + a.month) - (b.year * 12 + b.month));
const monthKey = m => `${m.year}-${m.month}`;
const nowD = new Date();
const curIdx = MONTHS.findIndex(m => m.year === nowD.getFullYear() && m.month === nowD.getMonth() + 1);
function autoMonthIdx() {
  if (curIdx >= 0) return curIdx;
  const v = nowD.getFullYear() * 12 + nowD.getMonth() + 1;
  const next = MONTHS.findIndex(m => m.year * 12 + m.month > v);
  return next >= 0 ? next : MONTHS.length - 1;
}
let mIdx = autoMonthIdx();
try {
  const k = sessionStorage.getItem("kondate-month");
  const i = MONTHS.findIndex(m => monthKey(m) === k);
  if (i >= 0) mIdx = i;
} catch (e) {}
const MONTH = MONTHS[mIdx];
function goMonth(i) {
  if (i < 0 || i >= MONTHS.length) return;
  try { sessionStorage.setItem("kondate-month", monthKey(MONTHS[i])); } catch (e) {}
  location.reload();
}

const WD = ["日","月","火","水","木","金","土"];
const Y = MONTH.year, M = MONTH.month;
const lastDay = new Date(Y, M, 0).getDate();
const dayNums = Array.from({ length: lastDay }, (_, i) => i + 1);
const info = d => MONTH.days[d] || { off: "給食なし" };
const wdOf = d => new Date(Y, M - 1, d).getDay();
const wdClass = (d) => { const w = wdOf(d); return (w === 0 || info(d).hol) ? "sun" : w === 6 ? "sat" : ""; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

// 料理名から「主食・主菜・副菜・汁物・果物」を自動で判定する
const CATS = {
  staple: "主食", main: "主菜", side: "副菜", soup: "汁物", fruit: "果物",
};
const has = (s, words) => words.some(w => s.includes(w));
function classify(name) {
  if (has(name, ["サラダ","和え","きんぴら","煮物","千キャベツ","八宝菜","フレンチ","関東煮","お浸し","ナムル"]) || name === "ブロッコリー") return "side";
  if (has(name, ["汁","スープ"])) return "soup";
  if (has(name, ["バナナ","オレンジ","梨","りんご","メロン","みかん","いちご"])) return "fruit";
  if (has(name, ["うどん","そば","スパゲッティ","スパゲティ","カレー","ライス","ご飯","ごはん","パン"])) return "staple";
  return "main";
}
const ORDER = ["staple","main","side","soup","fruit"];
// 1日分の料理を分類して並べる
function dishesOf(i) {
  const list = i.m.map(n => ({ n, c: classify(n) }));
  return list.sort((a, b) => ORDER.indexOf(a.c) - ORDER.indexOf(b.c));
}

// 今日の日付（この月の何日か）。月の外なら null
const now = new Date();
const todayNum = (now.getFullYear() === Y && now.getMonth() + 1 === M) ? now.getDate() : null;
const beforeMonth = new Date(now.getFullYear(), now.getMonth(), now.getDate()) < new Date(Y, M - 1, 1);

function firstServing(from) {
  for (let d = from; d <= lastDay; d++) if (!info(d).off) return d;
  return null;
}
// 今月の給食がもう残っていなくて、この月が次の月なら、最初の給食日に「次の給食」と出す
const curHasMore = curIdx >= 0 &&
  Object.entries(MONTHS[curIdx].days).some(([d, i]) => !i.off && +d > nowD.getDate());
const showNext = beforeMonth && mIdx === (curIdx >= 0 ? curIdx + 1 : autoMonthIdx()) && !curHasMore;
function relLabel(d) {
  if (todayNum == null) {
    if (showNext && d === firstServing(1)) return "次の給食";
    return "";
  }
  if (d === todayNum) return "今日";
  if (d === todayNum + 1) return "明日";
  if (d === todayNum - 1) return "昨日";
  return "";
}

let selected = todayNum ?? (beforeMonth ? (firstServing(1) ?? 1) : 1);

/* strip */
const strip = document.getElementById("strip");
strip.innerHTML = dayNums.map(d => {
  const i = info(d), cls = ["chip", wdClass(d)];
  if (i.off) cls.push("off");
  if (i.hol) cls.push("hol");
  if (i.ev) cls.push("ev");
  if (d === todayNum) cls.push("is-today");
  return `<button class="${cls.join(" ")}" data-d="${d}" aria-label="${M}月${d}日" aria-selected="false">
    <span class="wd">${WD[wdOf(d)]}</span><span class="d">${d}</span></button>`;
}).join("");
strip.addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  select(+b.dataset.d);
});

/* 栄養価（未満児／以上児） */
// 前回選んだほうで開く（はじめては以上児）
let age = "o";
try { if (localStorage.getItem("kondate-age") === "u") age = "u"; } catch (e) {}
function setAge(a) { age = a; try { localStorage.setItem("kondate-age", a); } catch (e) {} }
const nutriOf = d => MONTH.nutri?.[d]?.[age] || null;
const NUTRI_LABELS = [["エネルギー","kcal"],["たんぱく質","g"],["脂質","g"],["食塩相当量","g"]];
function nutriHTML(d) {
  const v = nutriOf(d); if (!v) return "";
  const avg = MONTH.nutri.avg?.[age] || [];
  const fmt = (x, k) => x == null ? null : (k === 0 ? String(x) : x.toFixed(1));
  const tiles = NUTRI_LABELS.map(([lab, unit], k) => {
    const val = fmt(v[k], k);
    return `<div class="nt"><p class="label">${lab}</p>
      <p class="nv">${val == null ? `<span class="na">—</span>` : `${val}<small>${unit}</small>`}</p>
      ${avg[k] != null ? `<p class="avg">月平均 ${fmt(avg[k], k)}${unit}</p>` : ""}</div>`;
  }).join("");
  const missing = v.some(x => x == null) ? `<p class="drink">「—」は献立表に記載がない、または誤りがあるため載せていない項目です</p>` : "";
  return `<div class="sec">
      <div class="nhead"><p class="label">栄養価</p>
        <div class="age" role="group" aria-label="年齢区分">
          <button data-age="u" aria-pressed="${age === "u"}">未満児</button>
          <button data-age="o" aria-pressed="${age === "o"}">以上児</button>
        </div></div>
      <div class="ntiles">${tiles}</div>${missing}
    </div>`;
}

/* day card */
const card = document.getElementById("card");
function renderCard(d) {
  const i = info(d), w = wdOf(d), rel = relLabel(d);
  const head = `<div class="dayhead">
      <div class="bigdate">${M}/${d}<span class="w ${wdClass(d)}">（${WD[w]}）</span></div>
      ${rel ? `<span class="rel">${rel}</span>` : ""}
    </div>`;
  const ev = i.ev ? `<div class="event"><b>${esc(i.ev)}</b>${i.evNote ? `<span>${esc(i.evNote)}</span>` : ""}</div>` : "";
  let body;
  if (i.off) {
    body = `<div class="offday"><p class="big">給食はお休み</p><p class="sub">${esc(i.off)}</p></div>`;
  } else {
    const dishes = dishesOf(i).map(x => `<li class="${x.c}"><span class="cat ${x.c}">${CATS[x.c]}</span>
      <span class="nm">${esc(x.n)}</span></li>`).join("");
    const snack = (lab, v) => {
      const txt = Array.isArray(v) ? v.join("・") : v;
      return `<div class="snack"><p class="label">${lab}</p><p class="${txt ? "" : "none"}">${txt ? esc(txt) : "なし"}</p></div>`;
    };
    body = `
      <div class="sec">
        <p class="label">お昼の給食</p>
        <ul class="dishes">${dishes}</ul>
        <p class="drink">飲み物：${esc(i.drink || "麦茶")}</p>
      </div>
      <div class="snacks">${snack("午前のおやつ", i.am)}${snack("午後のおやつ", i.pm)}</div>
      ${nutriHTML(d)}
      <details class="more" id="more-${d}">
        <summary>使われている材料を見る</summary>
        <div class="groups">
          <div class="grp red"><h4><i></i>血・肉・骨になる</h4><p>${esc(i.r)}</p></div>
          <div class="grp yellow"><h4><i></i>熱や力になる</h4><p>${esc(i.y)}</p></div>
          <div class="grp green"><h4><i></i>体の調子を整える</h4><p>${esc(i.g)}</p></div>
        </div>
      </details>`;
  }
  const prev = d > 1, nextOk = d < lastDay;
  card.innerHTML = head + ev + body + `
    <div class="nav">
      <button id="btn-prev" ${prev ? "" : "disabled"}>← ${prev ? `${d - 1}日（${WD[wdOf(d - 1)]}）` : "前の日"}</button>
      <button id="btn-next" ${nextOk ? "" : "disabled"}>${nextOk ? `${d + 1}日（${WD[wdOf(d + 1)]}）` : "次の日"} →</button>
    </div>`;
  // 材料の開閉状態を覚えておく
  const det = card.querySelector("details.more");
  if (det) {
    try { det.open = localStorage.getItem("kondate-open") === "1"; } catch (e) {}
    det.addEventListener("toggle", () => { try { localStorage.setItem("kondate-open", det.open ? "1" : "0"); } catch (e) {} });
  }
  card.querySelectorAll(".age button").forEach(b => b.onclick = () => { setAge(b.dataset.age); renderCard(d); });
  card.querySelector("#btn-prev").onclick = () => prev && slide(-1);
  card.querySelector("#btn-next").onclick = () => nextOk && slide(1);
}

function select(d, opts = {}) {
  selected = d;
  strip.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-selected", String(+c.dataset.d === d)));
  const chip = strip.querySelector(`.chip[data-d="${d}"]`);
  if (chip) {
    const target = chip.offsetLeft - strip.clientWidth / 2 + chip.clientWidth / 2;
    strip.scrollTo({ left: target, behavior: opts.instant ? "auto" : "smooth" });
  }
  renderCard(d);
  if (!opts.dir) { card.classList.remove("swap"); void card.offsetWidth; card.classList.add("swap"); }
  if (!opts.keepView) showView("day");
  updateTodayBtn();
}

/* 横スライドで前後の日へ。dir: 1 = 次の日, -1 = 前の日 */
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let busy = false;
function slide(dir) {
  const to = selected + dir;
  if (to < 1 || to > lastDay || busy) return;
  if (reduceMotion) { select(to); return; }
  busy = true;
  card.classList.remove("dragging", "swap");
  card.classList.add("sliding");
  card.style.transform = `translateX(${-dir * 105}%)`;
  card.style.opacity = "0";
  setTimeout(() => {
    select(to, { dir });
    card.classList.remove("sliding");
    card.style.transform = `translateX(${dir * 40}%)`;
    void card.offsetWidth;
    card.classList.add("sliding");
    card.style.transform = "";
    card.style.opacity = "";
    setTimeout(() => { card.classList.remove("sliding"); busy = false; }, 220);
  }, 180);
}

/* 指に合わせてカードが動くスワイプ */
let sx = null, sy = null, dragging = false, dxNow = 0;
card.addEventListener("touchstart", e => {
  if (busy) return;
  sx = e.touches[0].clientX; sy = e.touches[0].clientY; dragging = false; dxNow = 0;
}, { passive: true });
card.addEventListener("touchmove", e => {
  if (sx == null) return;
  const dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
  if (!dragging) {
    if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) { sx = null; return; }
    if (Math.abs(dx) > 10) { dragging = true; card.classList.add("dragging"); }
    else return;
  }
  const atEdge = (dx > 0 && selected <= 1) || (dx < 0 && selected >= lastDay);
  dxNow = atEdge ? dx * 0.25 : dx;
  card.style.transform = `translateX(${dxNow}px)`;
  card.style.opacity = String(1 - Math.min(Math.abs(dxNow) / 600, .35));
}, { passive: true });
card.addEventListener("touchend", () => {
  if (sx == null) return;
  sx = null;
  if (!dragging) return;
  dragging = false;
  const dir = dxNow < 0 ? 1 : -1;
  if (Math.abs(dxNow) > 70 && selected + dir >= 1 && selected + dir <= lastDay) { slide(dir); return; }
  card.classList.remove("dragging");
  card.classList.add("sliding");
  card.style.transform = ""; card.style.opacity = "";
  setTimeout(() => card.classList.remove("sliding"), 220);
});

/* 「今日」ボタン。別の月を見ているときは、今日の月（なければ次の月）へ戻る */
const homeDay = selected;
const todayBtn = document.getElementById("todaybtn");
const onHomeMonth = mIdx === autoMonthIdx();
todayBtn.textContent = (todayNum != null || (!onHomeMonth && curIdx >= 0)) ? "今日" : "次の給食";
todayBtn.onclick = () => {
  if (!onHomeMonth) { goMonth(autoMonthIdx()); return; }
  select(homeDay); window.scrollTo({ top: 0, behavior: "smooth" });
};
function updateTodayBtn() {
  const inDay = !document.getElementById("view-day").hidden;
  todayBtn.hidden = onHomeMonth && inDay && selected === homeDay;
}

/* 月の切り替え */
const mPrev = document.getElementById("m-prev"), mNext = document.getElementById("m-next");
mPrev.disabled = mIdx <= 0;
mNext.disabled = mIdx >= MONTHS.length - 1;
mPrev.onclick = () => goMonth(mIdx - 1);
mNext.onclick = () => goMonth(mIdx + 1);

/* list view */
const list = document.getElementById("list");
list.innerHTML = dayNums.map(d => {
  const i = info(d), w = WD[wdOf(d)];
  const cls = ["row"]; if (i.off) cls.push("off"); if (d === todayNum) cls.push("is-today");
  const dt = `<div class="dt">${d}<span class="${wdClass(d)}">${w}曜</span></div>`;
  if (i.off) return `<div class="${cls.join(" ")}">${dt}<div class="body"><div class="main">お休み（${esc(i.off)}）</div></div></div>`;
  const pm = Array.isArray(i.pm) ? i.pm.filter(x => x !== "牛乳").join("・") : i.pm;
  const snk = [i.am && `午前 ${i.am}`, pm && `午後 ${pm}`].filter(Boolean).join("／");
  return `<button class="${cls.join(" ")}" data-d="${d}">${dt}<div class="body">
      ${i.ev ? `<div class="tag">● ${esc(i.ev)}</div>` : ""}
      <div class="main">${esc(i.m.join("、"))}</div>
      <div class="snk">${esc(snk)}</div></div></button>`;
}).join("");
list.addEventListener("click", e => {
  const r = e.target.closest("button.row"); if (!r) return;
  select(+r.dataset.d);
  window.scrollTo({ top: 0 });
});
const notes = document.getElementById("notes");
if (MONTH.notes?.length) {
  notes.innerHTML = `<h3>おしらせ</h3><ul>${MONTH.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>`;
}

/* week view: 月曜はじまり、月〜土を表示（日曜は給食なしなので省く） */
const weekEl = document.getElementById("week");
function mondayOf(d) { const w = wdOf(d); return d - ((w + 6) % 7); }
let weekStart = mondayOf(selected);
function renderWeek() {
  const days = [];
  for (let d = weekStart; d < weekStart + 6; d++) if (d >= 1 && d <= lastDay) days.push(d);
  document.getElementById("wk-title").textContent = `${M}/${days[0]}（${WD[wdOf(days[0])]}）〜 ${M}/${days[days.length - 1]}（${WD[wdOf(days[days.length - 1])]}）`;
  document.getElementById("wk-prev").disabled = weekStart <= 1;
  document.getElementById("wk-next").disabled = weekStart + 7 > lastDay;
  weekEl.innerHTML = days.map(d => {
    const i = info(d), cls = ["row"]; if (i.off) cls.push("off"); if (d === todayNum) cls.push("is-today");
    const rel = relLabel(d);
    const dt = `<div class="dt">${d}<span class="${wdClass(d)}">${WD[wdOf(d)]}曜${rel ? `・${rel}` : ""}</span></div>`;
    if (i.off) return `<div class="${cls.join(" ")}">${dt}<div class="body"><div class="main">お休み（${esc(i.off)}）</div></div></div>`;
    const dishes = dishesOf(i).map(x => `<span><span class="cat ${x.c}">${CATS[x.c]}</span>${esc(x.n)}</span>`).join("");
    const kc = nutriOf(d)?.[0];
    const pm = Array.isArray(i.pm) ? i.pm.filter(x => x !== "牛乳").join("・") : i.pm;
    const snk = [i.am && `午前 ${i.am}`, pm && `午後 ${pm}`].filter(Boolean).join("／");
    return `<button class="${cls.join(" ")}" data-d="${d}">${dt}<div class="body">
        ${i.ev ? `<div class="tag">● ${esc(i.ev)}</div>` : ""}
        <div class="wdish">${dishes}</div>
        <div class="snk">${esc(snk)}${kc != null ? `<span class="wkcal">${kc} kcal</span>` : ""}</div></div></button>`;
  }).join("");
}
weekEl.addEventListener("click", e => {
  const r = e.target.closest("button.row"); if (!r) return;
  select(+r.dataset.d); window.scrollTo({ top: 0 });
});
document.getElementById("wk-prev").onclick = () => { weekStart -= 7; renderWeek(); };
document.getElementById("wk-next").onclick = () => { weekStart += 7; renderWeek(); };

/* tabs */
const VIEWS = ["day", "week", "list"];
let currentView = null;
function showView(v) {
  const changed = v !== currentView;
  currentView = v;
  VIEWS.forEach(x => {
    const sec = document.getElementById(`view-${x}`);
    sec.hidden = v !== x;
    document.getElementById(`tab-${x}`).setAttribute("aria-selected", String(v === x));
    if (v === x && changed && !reduceMotion) { sec.classList.remove("view-enter"); void sec.offsetWidth; sec.classList.add("view-enter"); }
  });
  strip.hidden = v !== "day";
  if (v === "week") { weekStart = mondayOf(selected); renderWeek(); }
  try { localStorage.setItem("kondate-view", v); } catch (e) {}
  if (typeof updateTodayBtn === "function") updateTodayBtn();
}
VIEWS.forEach(x => document.getElementById(`tab-${x}`).onclick = () => { showView(x); window.scrollTo({ top: 0 }); });

document.getElementById("ttl").firstChild.textContent = `${M}月の給食`;
select(selected, { instant: true, keepView: true });
let startView = "day";
try { const v = localStorage.getItem("kondate-view"); if (VIEWS.includes(v)) startView = v; } catch (e) {}
showView(startView);
</script>

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
